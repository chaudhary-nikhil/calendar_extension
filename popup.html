<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Calendar Quick Add</title>
    <style>
        body {
            width: 400px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        h1 {
            font-size: 20px;
            margin: 0 0 20px 0;
            color: #202124;
        }
        .event-form {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #5f6368;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .datetime-group {
            display: flex;
            gap: 10px;
        }
        .datetime-group input {
            flex: 1;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #1557b0;
        }
        button:disabled {
            background-color: #dadce0;
            cursor: not-allowed;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }
        .status.success {
            background-color: #e6f4ea;
            color: #137333;
            display: block;
        }
        .status.error {
            background-color: #fce8e6;
            color: #c5221f;
            display: block;
        }
        .info {
            font-size: 12px;
            color: #5f6368;
            margin-top: 10px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        .drop-zone {
            border: 2px dashed #dadce0;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            background-color: #f8f9fa;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .drop-zone:hover {
            border-color: #1a73e8;
            background-color: #e8f0fe;
        }
        .drop-zone.drag-over {
            border-color: #1a73e8;
            background-color: #e8f0fe;
            border-style: solid;
        }
        .drop-zone-text {
            color: #5f6368;
            font-size: 14px;
            margin: 0;
        }
        .drop-zone-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .divider {
            height: 1px;
            background-color: #dadce0;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>Add to Google Calendar</h1>
    
    <!-- Drag and Drop Zone for .ics/.ical files -->
    <div class="drop-zone" id="dropZone">
        <div class="drop-zone-icon">📅</div>
        <p class="drop-zone-text">Drag & drop .ics/.ical file here<br><small>or click to browse</small></p>
        <input type="file" id="icsFileInput" accept=".ics,.ical" style="display: none;">
    </div>
    
    <div class="divider"></div>
    
    <div class="event-form">
        <label for="eventTitle">Event Title:</label>
        <input type="text" id="eventTitle" placeholder="Enter event title">
        
        <label for="eventDate">Date:</label>
        <input type="date" id="eventDate">
        
        <label for="eventTime">Time:</label>
        <input type="time" id="eventTime">
        
        <button id="addEventBtn">Add to Calendar</button>
        <button id="signOutBtn">Sign Out</button>
        
        <div id="status" class="status"></div>
        
        <div class="info">
            <strong>Tip:</strong> Select text on any webpage and right-click, then choose "Add to Google Calendar" to automatically parse dates and times from the selected text.
        </div>
    </div>
    
    <script src="icsParser.js"></script>
    <script src="popup.js"></script>
</body>
</html>
