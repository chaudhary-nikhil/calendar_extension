<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Calendar Quick Add</title>
    <style>
        html, body {
            background: #f4f1ea;
        }
        body {
            box-sizing: border-box;
            width: 380px;
            margin: 0;
            padding: 36px 32px 28px;
            background: #f4f1ea;
            color: #1a1a1a;
            font-family: Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", serif;
            font-size: 16px;
            line-height: 1.4;
        }
        h1 {
            font-size: 22px;
            font-weight: 400;
            margin: 0 0 28px;
            letter-spacing: -0.01em;
        }
        .event-form {
            margin: 0;
        }
        label {
            display: block;
            margin: 0 0 4px;
            font-weight: 400;
            font-size: 15px;
        }
        input, textarea {
            width: 100%;
            margin: 0 0 18px;
            padding: 6px 0 8px;
            border: none;
            border-bottom: 1px solid #1a1a1a;
            border-radius: 0;
            background: transparent;
            color: #1a1a1a;
            font-family: inherit;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus, textarea:focus {
            outline: none;
            border-bottom-width: 1.5px;
        }
        input::placeholder {
            color: #8a8478;
        }
        textarea {
            resize: vertical;
            min-height: 72px;
        }
        button {
            width: 100%;
            margin: 8px 0 0;
            padding: 10px 12px;
            border: 1px solid #1a1a1a;
            border-radius: 0;
            background: #1a1a1a;
            color: #f4f1ea;
            font-family: inherit;
            font-size: 16px;
            font-weight: 400;
            cursor: pointer;
        }
        button:hover {
            background: #000;
        }
        button:disabled {
            background: #d9d3c7;
            border-color: #d9d3c7;
            color: #8a8478;
            cursor: not-allowed;
        }
        #signOutBtn {
            width: auto;
            margin: 14px 0 0;
            padding: 0;
            border: none;
            background: transparent;
            color: #1a1a1a;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        #signOutBtn:hover {
            background: transparent;
            color: #000;
        }
        .status {
            margin-top: 16px;
            font-size: 15px;
            display: none;
        }
        .status.success {
            display: block;
            color: #1a1a1a;
        }
        .status.error {
            display: block;
            color: #8a3b32;
        }
        .info {
            margin: 22px 0 0;
            font-size: 14px;
            line-height: 1.45;
            color: #1a1a1a;
        }
        .drop-zone {
            margin: 0 0 22px;
            padding: 0 0 14px;
            border: none;
            border-bottom: 1px solid #1a1a1a;
            background: transparent;
            cursor: pointer;
        }
        .drop-zone.drag-over .drop-zone-text {
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .drop-zone-text {
            margin: 0;
            color: #1a1a1a;
            font-size: 16px;
        }
        .divider {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Add to calendar</h1>

    <div class="drop-zone" id="dropZone">
        <p class="drop-zone-text">Drop an .ics file, or click to browse</p>
        <input type="file" id="icsFileInput" accept=".ics,.ical" style="display: none;">
    </div>

    <div class="event-form">
        <label for="eventTitle">Title</label>
        <input type="text" id="eventTitle" placeholder="Event name">

        <label for="eventDate">Date</label>
        <input type="date" id="eventDate">

        <label for="eventTime">Time</label>
        <input type="time" id="eventTime">

        <button id="addEventBtn">Add to calendar</button>
        <button id="signOutBtn">Sign out</button>

        <div id="status" class="status"></div>

        <p class="info">Select text on a page, right-click, and choose Add to Google Calendar.</p>
    </div>
    
    <script src="icsParser.js"></script>
    <script src="popup.js"></script>
</body>
</html>
